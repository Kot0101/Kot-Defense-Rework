name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y --fix-missing git zip unzip openjdk-17-jdk autoconf libtool libtool-bin libffi-dev libssl-dev cmake automake pkg-config

      - name: Build APK
        run: |
          yes | buildozer android debug
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotdefense-apk
          path: bin/*.apk
